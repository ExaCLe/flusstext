name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag does not match package version $version"
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:nemotron
      - name: Build Windows x64 installer
        run: npm run dist -- --publish never
      - name: Verify packaged app and installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "dist/Flusstext-Setup-$version.exe"
          if (!(Test-Path $installer)) { throw 'Installer is missing' }
          $app = (Resolve-Path 'dist/win-unpacked/Flusstext.exe').Path
          $actual = (Get-Item $app).VersionInfo.ProductVersion
          if (!$actual.StartsWith($version)) { throw "Unexpected executable version: $actual" }
          $process = Start-Process -FilePath $app -ArgumentList "--user-data-dir=$env:RUNNER_TEMP/FlusstextSmoke" -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) { throw "App exited during launch smoke check: $($process.ExitCode)" }
            if ($process.MainWindowTitle -notmatch 'Flusstext') { throw 'Flusstext window did not appear' }
          } finally {
            if (!$process.HasExited) { taskkill /PID $process.Id /T /F }
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.exe.sha256
          if-no-files-found: error
      - name: Upload to the prepared GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.exe(\.blockmap|\.sha256)?$' }
          gh release upload $env:GITHUB_REF_NAME @($files.FullName) --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
