appId: de.flusstext.app
productName: Flusstext
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - from: build
    to: build
    filter: [icon.png]
  - '!**/*.map'
asarUnpack:
  - node_modules/onnxruntime-web/**
  - node_modules/sherpa-onnx-*/**
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  language: '1031'
# Bereits installiertes Electron verwenden (kein zweiter Download)
electronDist: node_modules/electron/dist
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  identity: '-'
  hardenedRuntime: true
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Flusstext benötigt das Mikrofon für lokale Aufnahmen und Diktate.
  extraResources:
    - from: build/whisper-mac
      to: whisper
      filter: [whisper-server, LICENSE, SOURCE.txt]
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
